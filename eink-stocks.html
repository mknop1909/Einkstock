<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1.0">
<title>Akcie – e-ink</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#fff; color:#000;
  font-family:'Georgia','Times New Roman',serif;
  width:800px; min-height:480px;
  padding:18px 22px 14px;
}
header {
  display:flex; justify-content:space-between; align-items:baseline;
  border-bottom:2px solid #000; padding-bottom:6px; margin-bottom:8px;
}
header h1 { font-size:13px; font-weight:normal; letter-spacing:0.12em; text-transform:uppercase; }
header .ts { font-size:11px; font-family:'Courier New',monospace; }

.status {
  text-align:center; font-size:10px; color:#666;
  font-family:'Courier New',monospace; padding:3px 0 9px; min-height:22px;
}

.cards {
  display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:14px;
}
.card { border:1.5px solid #000; padding:10px 12px 8px; }
.ticker { font-size:20px; font-weight:bold; font-family:'Courier New',monospace; }
.cname  { font-size:9px; letter-spacing:0.07em; text-transform:uppercase; color:#444; margin-bottom:5px; }
.price  { font-size:26px; font-weight:bold; font-family:'Courier New',monospace; line-height:1; }
.chg    { font-size:11px; font-family:'Courier New',monospace; margin-top:3px; }
.meta   { font-size:9px; color:#555; margin-top:7px; display:grid; grid-template-columns:1fr 1fr; gap:2px 8px; }
.meta span { display:block; }
.lbl    { color:#999; font-size:8px; text-transform:uppercase; letter-spacing:0.05em; }

.charts { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:10px; }
.cwrap  { border:1px solid #ccc; padding:6px 8px 4px; }
.ctitle { font-size:9px; text-transform:uppercase; letter-spacing:0.1em; color:#666; margin-bottom:4px; font-family:'Courier New',monospace; }
canvas  { display:block; width:100%; height:60px; }

footer {
  border-top:1px solid #bbb; padding-top:5px;
  display:flex; justify-content:space-between;
  font-size:9px; color:#888; font-family:'Courier New',monospace;
}

.skel { display:inline-block; background:#ebebeb; border-radius:2px; animation:pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
</style>
</head>
<body>

<header>
  <h1>Přehled akcií</h1>
  <span class="ts" id="ts">—</span>
</header>

<div class="status" id="status">Načítám data ze stooq.com…</div>

<div class="cards">
  <div class="card" id="card-OKLO">
    <div class="ticker">OKLO</div><div class="cname">Oklo Inc.</div>
    <div class="price"><span class="skel" style="width:88px;height:26px;vertical-align:middle"></span></div>
    <div class="chg" style="margin-top:5px"><span class="skel" style="width:72px;height:11px"></span></div>
  </div>
  <div class="card" id="card-BRKB">
    <div class="ticker">BRK.B</div><div class="cname">Berkshire Hathaway B</div>
    <div class="price"><span class="skel" style="width:88px;height:26px;vertical-align:middle"></span></div>
    <div class="chg" style="margin-top:5px"><span class="skel" style="width:72px;height:11px"></span></div>
  </div>
  <div class="card" id="card-GOOGL">
    <div class="ticker">GOOGL</div><div class="cname">Alphabet Inc.</div>
    <div class="price"><span class="skel" style="width:88px;height:26px;vertical-align:middle"></span></div>
    <div class="chg" style="margin-top:5px"><span class="skel" style="width:72px;height:11px"></span></div>
  </div>
</div>

<div class="charts">
  <div class="cwrap"><div class="ctitle">OKLO – 30 dní</div><canvas id="sp-OKLO" role="img" aria-label="Graf OKLO"></canvas></div>
  <div class="cwrap"><div class="ctitle">BRK.B – 30 dní</div><canvas id="sp-BRKB" role="img" aria-label="Graf BRK.B"></canvas></div>
  <div class="cwrap"><div class="ctitle">GOOGL – 30 dní</div><canvas id="sp-GOOGL" role="img" aria-label="Graf GOOGL"></canvas></div>
</div>

<footer>
  <span>Zdroj: stooq.com (zdarma, bez registrace)</span>
  <span id="nxt">Obnova za 5:00</span>
  <span>Živý obraz / e-ink</span>
</footer>

<script>
// stooq.com symboly: oklo.us, brk-b.us, googl.us
// CSV endpoint vrací data přímo, CORS povolený
const STOCKS = [
  { id:'OKLO', stooq:'oklo.us',  label:'OKLO',  name:'Oklo Inc.' },
  { id:'BRKB', stooq:'brk-b.us', label:'BRK.B', name:'Berkshire Hathaway B' },
  { id:'GOOGL', stooq:'googl.us', label:'GOOGL', name:'Alphabet Inc.' }
];

function fp(n) {
  if (n==null||isNaN(n)) return '—';
  return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function f2(n,sign=true) {
  if (n==null||isNaN(n)) return '—';
  const v=Number(n);
  return (sign&&v>=0?'+':'')+v.toFixed(2);
}

function parseCSV(text) {
  const lines = text.trim().split('\n').filter(l=>l.trim());
  if (lines.length < 2) return [];
  const header = lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(',');
    const obj = {};
    header.forEach((h,i) => obj[h] = vals[i]?.trim());
    return obj;
  });
}

async function fetchStock(s) {
  // 30 denní history
  const today = new Date();
  const from = new Date(today); from.setDate(from.getDate()-45);
  const toStr = today.toISOString().slice(0,10).replace(/-/g,'');
  const fromStr = from.toISOString().slice(0,10).replace(/-/g,'');

  const url = `https://stooq.com/q/d/l/?s=${s.stooq}&d1=${fromStr}&d2=${toStr}&i=d`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP '+r.status);
  const text = await r.text();
  if (text.includes('No data') || text.trim().length < 30) throw new Error('Žádná data');

  const rows = parseCSV(text);
  if (!rows.length) throw new Error('Prázdná odpověď');

  // seřadit od nejstaršího po nejnovější
  rows.sort((a,b) => (a.Date||'').localeCompare(b.Date||''));
  const closes = rows.map(r=>parseFloat(r.Close)).filter(v=>!isNaN(v));
  const last = rows[rows.length-1];
  const price = parseFloat(last.Close);
  const open  = parseFloat(last.Open);
  const high  = parseFloat(last.High);
  const low   = parseFloat(last.Low);
  const vol   = parseFloat(last.Volume);

  // change = close - předchozí close
  const prevClose = rows.length >= 2 ? parseFloat(rows[rows.length-2].Close) : price;
  const change = price - prevClose;
  const changePct = (change / prevClose) * 100;

  return { price, open, high, low, vol, change, changePct, history: closes };
}

function renderCard(s, q) {
  const el = document.getElementById('card-'+s.id);
  if (!el) return;
  const arrow = q.change>=0 ? '▲' : '▼';
  el.innerHTML = `
    <div class="ticker">${s.label}</div>
    <div class="cname">${s.name}</div>
    <div class="price">${fp(q.price)}</div>
    <div class="chg">${arrow} ${f2(q.change)} (${f2(q.changePct)}%)</div>
    <div class="meta">
      <span><span class="lbl">Otevření</span>${fp(q.open)}</span>
      <span><span class="lbl">Max</span>${fp(q.high)}</span>
      <span><span class="lbl">Min</span>${fp(q.low)}</span>
      <span><span class="lbl">Objem</span>${q.vol?(q.vol/1e6).toFixed(1)+'M':'—'}</span>
    </div>`;
}

function drawSpark(id, history) {
  const canvas = document.getElementById('sp-'+id);
  if (!canvas) return;
  const valid = (history||[]).filter(v=>!isNaN(v));
  const W = canvas.offsetWidth||220, H=60;
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  if (valid.length<2) { ctx.fillStyle='#bbb'; ctx.font='9px Courier New'; ctx.fillText('—',8,35); return; }
  const mn=Math.min(...valid), mx=Math.max(...valid), rng=mx-mn||1, pd=4;
  const x=i=>pd+(i/(valid.length-1))*(W-pd*2);
  const y=v=>H-pd-((v-mn)/rng)*(H-pd*2);
  ctx.beginPath(); ctx.moveTo(x(0),y(valid[0]));
  for(let i=1;i<valid.length;i++) ctx.lineTo(x(i),y(valid[i]));
  ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.lineTo(x(valid.length-1),H); ctx.lineTo(x(0),H); ctx.closePath();
  ctx.fillStyle='rgba(0,0,0,0.07)'; ctx.fill();
  ctx.fillStyle='#000'; ctx.beginPath();
  ctx.arc(x(valid.length-1),y(valid[valid.length-1]),3,0,Math.PI*2); ctx.fill();
}

function setTs() {
  const n=new Date();
  document.getElementById('ts').textContent =
    n.toLocaleDateString('cs-CZ')+' '+n.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});
}

let cd=300;
function tick() {
  cd--;
  if(cd<=0){loadAll();cd=300;}
  const m=Math.floor(cd/60),s=cd%60;
  document.getElementById('nxt').textContent=`Obnova za ${m}:${String(s).padStart(2,'0')}`;
}

async function loadAll() {
  setTs();
  const st=document.getElementById('status');
  st.textContent='Stahuji kurzy ze stooq.com…';
  let ok=0, err=[];
  for(const s of STOCKS) {
    try {
      const q=await fetchStock(s);
      renderCard(s,q);
      setTimeout(()=>drawSpark(s.id,q.history),60);
      ok++;
    } catch(e) {
      err.push(s.label+': '+e.message);
      const el=document.getElementById('card-'+s.id);
      if(el) el.innerHTML=`<div class="ticker">${s.label}</div><div class="cname" style="color:#c00;margin-top:8px">Chyba načítání</div>`;
    }
  }
  st.textContent = ok===STOCKS.length
    ? `Data aktualizována ✓  (${new Date().toLocaleTimeString('cs-CZ')})`
    : `Načteno ${ok}/${STOCKS.length} – chyby: ${err.join(', ')}`;
}

loadAll();
setInterval(tick,1000);
</script>
</body>
</html>
